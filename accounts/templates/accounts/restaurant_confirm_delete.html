<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Restaurant - FoodGo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );
        }

        .delete-container {

            width: 90%;
            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .delete-icon {

            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #fee2e2;

            font-size: 40px;
        }

        h1 {

            margin: 0 0 15px;

            color: #1f2937;

            font-size: 28px;
        }

        .warning {

            color: #6b7280;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .restaurant-name {

            display: inline-block;

            padding: 10px 18px;

            margin-bottom: 25px;

            border-radius: 10px;

            background: #f3f4f6;

            color: #111827;

            font-weight: bold;

            font-size: 18px;
        }

        .buttons {

            display: flex;

            gap: 12px;

            justify-content: center;

            flex-wrap: wrap;
        }

        .btn {

            border: none;

            padding: 12px 24px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;

            transition: 0.2s;
        }

        .btn-delete {

            background: #dc2626;

            color: white;
        }

        .btn-delete:hover {

            background: #b91c1c;
        }

        .btn-cancel {

            background: #e5e7eb;

            color: #374151;
        }

        .btn-cancel:hover {

            background: #d1d5db;
        }

    </style>

</head>


<body>

    <div class="delete-container">

        <div class="delete-icon">
            🗑️
        </div>


        <h1>
            Delete Restaurant?
        </h1>


        <p class="warning">

            Are you sure you want to delete this restaurant?

            <br>

            This action cannot be undone.

        </p>


        <div class="restaurant-name">

            {{ restaurant.name }}

        </div>


        <form
            method="POST"
        >

            {% csrf_token %}


            <div class="buttons">

                <!-- CANCEL -->

                <a
                    href="{% url 'home' %}"
                    class="btn btn-cancel"
                >
                    Cancel
                </a>


                <!-- DELETE -->

                <button
                    type="submit"
                    class="btn btn-delete"
                >
                    Yes, Delete
                </button>

            </div>

        </form>

    </div>

</body>

</html>
