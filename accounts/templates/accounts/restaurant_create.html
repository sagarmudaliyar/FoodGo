<!DOCTYPE html>
<html>
<head>
    <title>Add Restaurant - FoodGo</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7ed, #ffedd5, #fef3c7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 550px;
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .icon {
            text-align: center;
            font-size: 50px;
        }

        .logo {
            text-align: center;
            color: #f97316;
            font-size: 32px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #f97316;
        }

        textarea {
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row > div {
            flex: 1;
        }

        .add-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #f97316, #ea580c);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: linear-gradient(90deg, #ea580c, #c2410c);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #f97316;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">🍽️🏪</div>

    <div class="logo">FoodGo</div>

    <div class="subtitle">
        Add a new restaurant to FoodGo
    </div>

    <h1>➕ Add Restaurant</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Restaurant Name</label>
        <input
            type="text"
            name="name"
            placeholder="e.g. Pizza Palace"
            required
        >

        <label>Description</label>
        <textarea
            name="description"
            rows="3"
            placeholder="Short description about the restaurant..."
        ></textarea>

        <label>Cuisine</label>
        <input
            type="text"
            name="cuisine"
            placeholder="e.g. Italian, Pizza, Pasta"
            required
        >

        <div class="row">

            <div>
                <label>Rating</label>
                <input
                    type="number"
                    name="rating"
                    min="0"
                    max="5"
                    step="0.1"
                    value="4.5"
                    required
                >
            </div>

            <div>
                <label>Price for Two (₹)</label>
                <input
                    type="number"
                    name="price_for_two"
                    placeholder="350"
                    required
                >
            </div>

        </div>

        <label>Delivery Time</label>
        <input
            type="text"
            name="delivery_time"
            placeholder="20–30 min"
            required
        >

        <label>Category</label>
        <select name="category" required>

            <option value="">Select Category</option>
            <option value="Pizza">🍕 Pizza</option>
            <option value="Burgers">🍔 Burgers</option>
            <option value="Indian">🍛 Indian</option>
            <option value="Chinese">🥡 Chinese</option>
            <option value="Desserts">🧁 Desserts</option>
            <option value="Healthy">🥗 Healthy</option>
            <option value="Beverages">🥤 Beverages</option>

        </select>

        <button type="submit" class="add-btn">
            🏪 Add Restaurant
        </button>

    </form>

    <a href="{% url 'home' %}" class="back">
        ← Back to FoodGo Home
    </a>

</div>

</body>
</html>
