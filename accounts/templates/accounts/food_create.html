<!DOCTYPE html>
<html>
<head>
    <title>Add Food - FoodGo</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7ed, #ffedd5, #fef3c7);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 500px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #f97316;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #f97316;
        }

        textarea {
            resize: vertical;
        }

        .add-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #f97316, #ea580c);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: linear-gradient(90deg, #ea580c, #c2410c);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #f97316;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        .food-icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="food-icon">🍕🍔🥤</div>

    <div class="logo">FoodGo</div>

    <div class="subtitle">
        Add a delicious new item
    </div>

    <h1>➕ Add New Food</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Restaurant</label>

        <select name="restaurant" required>
            <option value="">Select Restaurant</option>

            {% for restaurant in restaurants %}
                <option value="{{ restaurant.id }}">
                    {{ restaurant.name }}
                </option>
            {% endfor %}
        </select>


        <label>Food Name</label>

        <input
            type="text"
            name="name"
            placeholder="e.g. Cheese Garlic Bread"
            required
        >


        <label>Description</label>

        <textarea
            name="description"
            rows="4"
            placeholder="Describe the food item..."
        ></textarea>


        <label>Price (₹)</label>

        <input
            type="number"
            name="price"
            step="0.01"
            placeholder="199"
            required
        >


        <label>Category</label>

        <input
            type="text"
            name="category"
            placeholder="e.g. Starter, Main Course, Dessert"
            required
        >


        <button type="submit" class="add-btn">
            🍽️ Add Food Item
        </button>

    </form>

    <a href="{% url 'food_list' %}" class="back">
        ← Back to Food List
    </a>

</div>

</body>
</html>
